[project]
name = "xmeta-worker"
version = "0.1.0"
description = "Async generation workers for X-META Video."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.0",
  "rq>=1.16.0",
  "httpx>=0.27.0",
  "boto3>=1.34.0",
  "orjson>=3.10.0",
  "structlog>=24.0.0",
  "tenacity>=8.5.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"

